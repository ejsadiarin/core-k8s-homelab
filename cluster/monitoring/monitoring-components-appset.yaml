apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: monitoring-components
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  generators:
    - git:
        repoURL: https://github.com/ejsadiarin/core-k8s-homelab.git
        revision: cluster
        directories:
          - path: cluster/monitoring/kube-prometheus-stack
          - path: cluster/monitoring/prometheus-adapter
  template:
    metadata:
      name: '{{path.basename}}'
      labels:
        type: monitoring
    spec:
      project: monitoring
      source:
        plugin:
          name: kustomize-build-with-helm
        repoURL: https://github.com/ejsadiarin/core-k8s-homelab.git
        targetRevision: cluster
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 5m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - ApplyOutOfSyncOnly=true
          - RespectIgnoreDifferences=true
      ignoreDifferences:
        - group: monitoring.coreos.com
          kind: ServiceMonitor
          jsonPointers:
            - /spec/endpoints
        - group: monitoring.coreos.com
          kind: Prometheus
          jsonPointers:
            - /status
        - group: monitoring.coreos.com
          kind: Alertmanager
          jsonPointers:
            - /status
        - group: monitoring.coreos.com
          kind: PrometheusRule
          jsonPointers:
            - /status
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          jsonPointers:
            - /status
            - /spec/rules/0/backendRefs/0/weight
            - /spec/rules/0/backendRefs/0/kind
            - /spec/rules/0/backendRefs/0/group
          jqPathExpressions:
            - '.spec.parentRefs[]?.group'
            - '.spec.parentRefs[]?.kind'
            - '.spec.rules[]?.backendRefs[]?.group'
            - '.spec.rules[]?.backendRefs[]?.kind'
            - '.spec.rules[]?.backendRefs[]?.weight'
        - group: ""
          kind: Secret
          jsonPointers:
            - /data
      info:
        - name: Description
          value: 'Monitoring component: {{path.basename}}'
