apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: longhorn-components
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  generators:
    - git:
        repoURL: https://github.com/ejsadiarin/core-k8s-homelab.git
        revision: cluster
        directories:
          - path: cluster/infrastructure/storage/longhorn
  template:
    metadata:
      name: '{{path.basename}}'
      labels:
        type: storage
    spec:
      project: infrastructure
      source:
        plugin:
          name: kustomize-build-with-helm
        repoURL: https://github.com/ejsadiarin/core-k8s-homelab.git
        targetRevision: cluster
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - ApplyOutOfSyncOnly=true
          - RespectIgnoreDifferences=true
      ignoreDifferences:
        # Longhorn webhook CA bundles
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jsonPointers:
            - /webhooks/*/clientConfig/caBundle
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          jsonPointers:
            - /webhooks/*/clientConfig/caBundle
        # Longhorn CRD status fields
        - group: longhorn.io
          kind: Volume
          jsonPointers:
            - /status
        - group: longhorn.io
          kind: Node
          jsonPointers:
            - /status
        - group: longhorn.io
          kind: Setting
          jsonPointers:
            - /status
        - group: longhorn.io
          kind: Engine
          jsonPointers:
            - /status
        - group: longhorn.io
          kind: Replica
          jsonPointers:
            - /status
        # HTTPRoute for Longhorn UI
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          jsonPointers:
            - /status
      info:
        - name: Description
          value: 'Longhorn distributed storage system'
