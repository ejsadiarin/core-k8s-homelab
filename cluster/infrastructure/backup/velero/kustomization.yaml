apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: velero

resources:
  - namespace.yaml
  - b2-credentials-sealed.yaml
  - daily-backup.yaml
  - weekly-backup.yaml

helmCharts:
  - name: velero
    repo: https://vmware-tanzu.github.io/helm-charts
    version: 8.6.0
    releaseName: velero
    namespace: velero
    valuesFile: values.yaml
    includeCRDs: true
