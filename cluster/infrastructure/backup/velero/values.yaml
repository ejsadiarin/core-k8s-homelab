---
# Fix: Use kubectl image version that exists (bitnami doesn't have 1.33 yet)
# Use 1.32 which is compatible with Kubernetes 1.33
kubectl:
  image:
    repository: bitnami/kubectl
    tag: "1.32"

configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: YOUR_B2_BUCKET_NAME
      default: true
      config:
        region: auto
        s3ForcePathStyle: true
        s3Url: https://s3.us-west-000.backblazeb2.com
  volumeSnapshotLocation:
    - name: default
      provider: aws
      config:
        region: auto
        s3ForcePathStyle: true
        s3Url: https://s3.us-west-000.backblazeb2.com

credentials:
  useSecret: true
  existingSecret: velero-b2-credentials

deployNodeAgent: true
nodeAgent: # NodeAgent (formerly Restic) for file-level backups
  podVolumePath: /var/lib/kubelet/pods
  privileged: false

serviceAccount:
  server:
    create: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector:
  kubernetes.io/arch: amd64

metrics:
  enabled: true

# NOTE: enableRestic and restic keys are deprecated in Velero chart 8.x
# Use deployNodeAgent and nodeAgent instead
