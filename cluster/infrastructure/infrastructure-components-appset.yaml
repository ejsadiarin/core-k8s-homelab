apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure-components
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  generators:
    - git:
        repoURL: https://github.com/ejsadiarin/core-k8s-homelab.git
        revision: cluster
        directories:
          - path: cluster/infrastructure/networking/*
          - path: cluster/infrastructure/storage/*
          - path: cluster/infrastructure/controllers/*
          - path: cluster/infrastructure/backup/*
          - exclude: true
            path: cluster/infrastructure/storage/csi-driver-nfs
          - exclude: true
            path: cluster/infrastructure/storage/csi-driver-smb
          - exclude: true
            path: cluster/infrastructure/storage/longhorn
  template:
    metadata:
      name: '{{path.basename}}'
      labels:
        type: infrastructure
    spec:
      project: infrastructure
      source:
        plugin:
          name: kustomize-build-with-helm
        repoURL: https://github.com/ejsadiarin/core-k8s-homelab.git
        targetRevision: cluster
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - ApplyOutOfSyncOnly=true
          - RespectIgnoreDifferences=true
      ignoreDifferences:
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jsonPointers:
            - /webhooks/*/clientConfig/caBundle
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          jsonPointers:
            - /webhooks/*/clientConfig/caBundle
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jsonPointers:
            - /spec/preserveUnknownFields
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          jsonPointers:
            - /status
            - /spec/rules/0/backendRefs/0/weight
            - /spec/rules/0/backendRefs/0/kind
            - /spec/rules/0/backendRefs/0/group
        - group: "apps"
          kind: "StatefulSet"
          jqPathExpressions:
            - ".spec.volumeClaimTemplates[].apiVersion"
            - ".spec.volumeClaimTemplates[].kind"
      info:
        - name: Description
          value: 'Infrastructure component: {{path.basename}}'
