---
# File: nginx/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - pvc.yaml
  - httproute.yaml
  - ../../common/cilium-network-policies

namespace: nginx

labels:
  - pairs:
      app.kubernetes.io/name: nginx
      app.kubernetes.io/part-of: web-apps
      app.kubernetes.io/managed-by: argocd

