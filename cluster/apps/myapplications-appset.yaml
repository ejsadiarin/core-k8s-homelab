# apps/myapplications-appset.yaml
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: applications
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  generators:
    - git:
        repoURL: https://github.com/ejsadiarin/core-k8s-homelab.git
        revision: cluster
        directories:
          - path: cluster/apps/*
          - exclude: true
            path: cluster/apps/myapplications-appset.yaml
  template:
    metadata:
      # Changed from 'app-{{path.basename}}' to just '{{path.basename}}'
      name: '{{path.basename}}'
      labels:
        type: application
    spec:
      project: applications
      source:
        plugin:
          name: kustomize-build-with-helm
        repoURL: https://github.com/ejsadiarin/core-k8s-homelab.git
        targetRevision: cluster
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - ApplyOutOfSyncOnly=true
          - RespectIgnoreDifferences=true
      ignoreDifferences:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          jsonPointers:
            - /status
            - /spec/rules/0/backendRefs/0/weight
            - /spec/rules/0/backendRefs/0/kind
            - /spec/rules/0/backendRefs/0/group
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/template/spec/initContainers/*/resources
            - /spec/template/spec/containers/*/resources
        - group: ""
          kind: PersistentVolumeClaim
          jsonPointers:
            - /status
        - group: ""
          kind: Service
          jsonPointers:
            - /status
      info:
        - name: Description
          value: 'User application: {{path.basename}}'
